<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Test</title>
    <style>
        *,
        body {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        .con {
            height: 100%;
        }

        nav {
            height: 10vh;
            background-color: #2838bf;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;

            h3 {
                margin-left: 3%;
                font-size: 30px;
            }
        }

        .right-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-right: 3%;
        }

        ul {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
            list-style-type: none;
            margin-right: 10px;

            li {
                font-size: 19px;
            }
        }

        section {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 90vh;
            gap: 15px;
        }

        .heading {
            color: #2838bf;
            font-weight: bold;
            font-size: 46px;
        }

        .description {
            color: #333c4e;
            font-size: 25px;
        }

        .btn-outline {
            border-radius: 5px;
            border: 1px solid white;
            background-color: transparent;
            padding: 5px 16px;
            color: white;
            color: white;
            font-size: 19px;
        }

        .btn-filled {
            padding: 5px 16px;
            border-radius: 5px;
            background-color: #ffffff;
            color: #7b49ba;
            border: 1px solid white;
            font-size: 19px;
            font-weight: bold
        }
    </style>
</head>

<body>
    <div class="con">
        <nav>
            <h3>NAV BAR</h3>
            <div class="right-container">
                <ul>
                    <li>Home</li>
                    <li>About</li>
                    <li>Blog</li>
                    <li>Contact</li>
                </ul>
                <button class="btn-outline">Sign In</button>
                <button class="btn-filled">Sign Up</button>
            </div>
        </nav>
        <section>
            <h1 class="heading">NAVIGATION BAR</h1>
            <h4 class="description">HTML & CSS ONLY</h4>
        </section>
    </div>
</body>

</html>
